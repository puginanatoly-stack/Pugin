# Personal Engineering Blueprint — Personality Model (Слой 1)
# Заполняется и уточняется самим Анатолием. TODO/null-поля — не выдумывать, ждать реального ответа.
# status: draft — гипотеза (от TooLi или внешнего AI), НЕ факт, пока Анатолий не подтвердит/поправит и не уберёт status.
# status: confirmed — подтверждено Анатолием напрямую. status: rejected — явно отклонено, с причиной.
# status: ambivalent — ни то ни другое: не нравится по умолчанию, но Анатолий сознательно держит вопрос открытым
# (думает над более эффективным применением) — не путать с draft (там просто не спросили) или rejected (там решение принято).

identity:
  role: "Архитектор — ведёт команду 1C-разработки, лично пишет на Python и Kotlin/Android"
  scope: ["1C architecture & team leadership", "Python (general-purpose)", "Kotlin/Android"]

worldview:
  systems_thinking: "Всё взаимосвязано — структура и архитектура важнее локального фикса; решения оцениваются по последствиям, не только по немедленному результату."
  human_ai_symbiosis: "Будущее — симбиоз человека и AI, не замена. Предлагать сотрудничество, не однобокую автоматизацию."
  planning_style: "Architecture-down — сначала форма решения согласуется, потом пишется код."

decision_style:
  default_bias: "Элегантное/масштабируемое решение важнее быстрого фикса — готов тратить больше времени ради архитектурного качества."
  values_priority: "Надёжность > Предсказуемость/контролируемость ≈ Эффективность > Масштабируемость (только по необходимости) > Красота архитектуры (= гибкость/модифицируемость)"
  risk_definition: "Риск — это НЕ вероятность ошибки от принятого решения (обычная 0-1 шкала авантюризма отклонена как не соответствующая модели). Риск — это вероятность отклонения от заданной траектории проекта из-за новых вводных/неизвестных, возникающих по ходу. Оцениваю вероятность, что новых вводных НЕ будет — этим измеряется риск. Связано с H005 (проактивный поиск критических точек — картирование неизвестных заранее снижает вероятность отклонения от траектории)."
  # confirmed 2026-08-20: числовой коэффициент 0-1 не запрошен — редефиниция риска важнее одного числа

# Подтверждено Анатолием напрямую 2026-08-20 — веса и определения его словами
values:
  - name: "Надёжность"
    weight: 0.70
    status: confirmed
    confirmed_date: "2026-08-20"
    description: "Наивысший вес среди ценностей"
  - name: "Предсказуемость и контролируемость"
    weight: 0.60
    status: confirmed
    confirmed_date: "2026-08-20"
    description: "Система должна вести себя ожидаемо и оставаться управляемой"
  - name: "Эффективность"
    weight: 0.60
    status: confirmed
    confirmed_date: "2026-08-20"
    description: "Минимум ресурсов на максимум результата"
  - name: "Масштабируемость"
    weight: null   # ситуативная, не фиксированный вес — по словам Анатолия
    status: confirmed
    confirmed_date: "2026-08-20"
    description: "В случае необходимости — не всегда это нужно (перекликается с H002/P09: не проектировать про запас, которого не требует объём)"
  - name: "Красота кода/архитектуры"
    weight: null   # не числовая ценность — определяется через гибкость, см. description
    status: confirmed
    confirmed_date: "2026-08-20"
    description: "Не эстетика, а способность системы к модификации. Негибкая система — даже самая красивая архитектура в моменте — считается закостенелой и неприменимой для больших задач."

cognitive_biases:
  known: []   # TODO: сознательно прописанные искажения, например "перепроверяю факты, если сумма сделки > X"

# Эвристики H001/H002 — принципы подтверждены Анатолием напрямую (2026-08-20: "да, это мой принцип").
# Формулировка rule ниже — нейтральный пересказ принципа, не оспаривалась. Числовые пороги
# в decision_matrix НЕ подтверждены — Анатолий не называл своих цифр, остаются TODO.
decision_heuristics:
  rules_of_thumb:
    - id: "H001"
      name: "Закон Парето для решений"
      status: confirmed
      confirmed_date: "2026-08-20"
      rule: "Прежде чем углубляться в детали, искать решение, дающее 80% результата за 20% усилий; не усложнять без веских причин."
      trigger: "Начало любой задачи или проектирования"
    - id: "H002"
      name: "Экспоненциальный порог сложности"
      status: confirmed
      confirmed_date: "2026-08-20"
      rule: "Риск и сложность растут нелинейно с объёмом проекта (сущности/интеграции/люди) — при росте объёма переключаюсь в режим архитектора."
      trigger: "Оценка объёма проекта или задачи"
      decision_matrix: null   # TODO: конкретные пороги (строки кода/сущности/команды) — сам принцип подтверждён, но цифры Анатолий не называл
    - id: "H003"
      name: "Опережающее проектирование (контр-YAGNI)"
      status: confirmed
      confirmed_date: "2026-08-20"
      rule: "Иногда сознательно закладываю функциональность выше текущих требований, если вижу перспективу — в отличие от строгого YAGNI."
      trigger: null   # TODO: когда именно решаешь заложить запас, а когда нет — конкретного правила/сигнала ещё нет, только сам принцип
    - id: "H004"
      name: "Итеративная доработка с мгновенным откатом"
      status: confirmed
      confirmed_date: "2026-08-20"
      rule: "Предпочитаю постепенную итерационную доработку системы с возможностью мгновенного переключения на предыдущую версию, если что-то пошло не так — особенно важно на крупных проектах."
      trigger: "Крупные проекты, где цена ошибки/простоя высока"
      note: "Причина отказа от Strangler Fig (P02): та миграция однонаправленная (легаси отмирает без пути назад), а тут ценен именно мгновенный откат. Близкие индустриальные паттерны — Feature Flags / Blue-Green Deployment — но названо не подтверждено, только твоя формулировка."
    - id: "H005"
      name: "Тест на отторжение (проактивный поиск критических точек)"
      status: confirmed
      confirmed_date: "2026-08-20"
      rule: "Заранее выявляю критичные точки в интеграциях и функционале — слабые места, при достижении которых система заходит в точку невозврата. Отслеживаю приближение к пиковым нагрузкам и своевременно меняю технические решения/приоритеты, не дожидаясь фактического отказа."
      trigger: "Проектирование интеграций/функционала — особенно там, где ожидается рост нагрузки"
      note: "Проактивная сторона H002 (экспоненциальный порог сложности), P06 (Circuit Breaker) и P09 (N+1 Rule) — там про реакцию на предел/капасити-план, здесь про заблаговременное картирование самих точек отказа."
    - id: "H006"
      name: "Замедление под нагрузкой (сложность × усталость)"
      status: confirmed
      confirmed_date: "2026-08-20"
      rule: "При росте усталости — своей и команды в целом — сознательно замедляю принятие решений, особенно на сложных проектах. Риск плохого решения растёт вместе со сложностью и усталостью одновременно; замедление снижает вероятность ошибок."
      trigger: "Растущая усталость (своя и/или команды) на фоне сложного проекта"
      note: "Реакция — замедление темпа принятия решений, а не полная остановка/блокировка (в отличие от предложенной внешним AI 'Красной зоны', где агент должен блокировать решения — это НЕ подтверждено). Связано с H002: там сложность сама по себе, здесь сложность × усталость как два перемножающихся фактора риска. TODO: конкретный личный сигнал 'я устал/команда устала' ещё не сформулирован — открытый вопрос."
    - id: "H007"
      name: "Изучение недокументированных возможностей"
      status: confirmed
      confirmed_date: "2026-08-20"
      rule: "Сверх обязательного регламента/спецификации целенаправленно изучаю недокументированные возможности систем — они могут дать значительное усиление (например, безопасности/изоляции) при минимальных ресурсных затратах."
      trigger: "Работа в рамках жёсткого регламента/комплаенса — ищу, что можно улучшить сверх формальных требований"
      note: "Из реального кейса C002 (2001, инфобезопасность в банке — недокументированные возможности Windows дали ~300% прирост изоляции при минимальных затратах). Связано с H001 (минимум ресурсов, максимум эффекта) и H005 (проактивный поиск точек усиления/отказа)."
    - id: "H008"
      name: "Автоматизация до измеримого предела"
      status: confirmed
      confirmed_date: "2026-08-20"
      rule: "Автоматизация производственных процессов почти всегда даёт результат — автоматизирует ручной труд, вскрывает узкие места процесса. Но критично: нужен измеримый показатель финала, и вовремя остановиться — иначе получается автоматизация ради автоматизации."
      trigger: "Проекты автоматизации процессов — определение точки остановки"
      note: "Из опыта автоматизации производственных процессов (перекликается с контекстом C003). Связано с H001 (Парето — не гнаться за идеалом сверх нужного результата) и H002 (знать порог, когда сложности достаточно)."
    - id: "H009"
      name: "Пилотная группа → лидеры-тренеры"
      status: confirmed
      confirmed_date: "2026-08-20"
      rule: "При масштабном внедрении (много площадок/большая численность) тестирую на пилотной/опытной группе пользователей — это не только экономит время на выявление проблем, но и производит лидеров, способных обучить остальных при дальнейшем тиражировании."
      trigger: "Внедрение нового функционала/системы на множестве площадок или большом количестве пользователей"
      note: "Из кейса C004 (2012, пищевое производство, 10 заводов по 1500 человек). Организационный/масштабирующий аналог технического P12 (Canary) — не про деплой, а про то, как пилотная группа превращается в двигатель дальнейшего обучения/внедрения."
    - id: "H010"
      name: "Накопление обратной связи в базе знаний"
      status: confirmed
      confirmed_date: "2026-08-20"
      rule: "Собираю обратную связь от пользователей и накапливаю её в базе знаний — повторяющиеся ошибки/вопросы фиксируются один раз и решаются на уровне системы, что кратно снижает число ошибок со временем."
      trigger: "Системы с активным пользовательским взаимодействием, где повторяются похожие ошибки/вопросы"
      note: "Из кейса C006 (2015, финтех-учёт в строительной отрасли) — функционал, аналогичный Naumen (сбор фидбека + база знаний)."
    - id: "H011"
      name: "Приоритизация по сильным сторонам, не 'плохим сотрудникам'"
      status: confirmed
      confirmed_date: "2026-08-20"
      rule: "Плохих сотрудников не существует — есть задачи, назначенные не тому, кто сделает их быстро. Определяю сильные стороны каждого участника команды и перераспределяю задачи под них. Дополнительно использую короткие перекрёстные оценки мнений — людей и AI-агентов — чтобы определить риски и направления разработки проекта."
      trigger: "Приоритизация в кризисе / когда всё горит одновременно"
      note: "Управленческий слой. Часть более широкого ответа на 'приоритизация когда всё горит' вместе с H012."
    - id: "H012"
      name: "Трёхуровневая матрица приоритетов в кризисе"
      status: confirmed
      confirmed_date: "2026-08-20"
      rule: "Когда всё горит одновременно, делю задачи на три категории: (1) те, что надо выполнить на 500% — критичные; (2) те, что обязательны, но есть риск срыва сроков; (3) те, что не важны и подождут."
      trigger: "Приоритизация в кризисе / когда всё горит одновременно"
      note: "Управленческий слой. Работает вместе с H011 (кто делает) — эта эвристика про что делать первым."
    - id: "H013"
      name: "Архитектура остаётся за мной, но решается коллективно"
      status: confirmed
      confirmed_date: "2026-08-20"
      rule: "Концепцию и архитектуру проекта никогда не делегирую полностью — но не решаю их в одиночку. Использую архитектурный комитет: коллективный разум — формула, приводящая к хорошему результату."
      trigger: "Делегирование задач в команде"
      note: "Управленческий слой. Нюанс: 'оставляю себе' означает финальную ответственность/оверсайт, а не единоличное решение — механизм принятия решения коллективный (комитет)."
    - id: "H014"
      name: "Кризис-менеджмент: сам, быстро, до рабочего ядра"
      status: confirmed
      confirmed_date: "2026-08-20"
      rule: "В кризисе принимаю быстрые короткие решения сам. Принцип — отсечь всё лишнее, оставить рабочее ядро, без бюрократии. Осознанно допускаю, что часть функционала временно будет недоступна, если большая часть ядра сохранена."
      trigger: "Кризис в команде/проекте (дедлайн, конфликт, провал)"
      note: "Управленческий слой. Кризисный вариант H001 (Парето) — экстремальное урезание до рабочего минимума под давлением времени."
    - id: "H015"
      name: "Найм: комплементарность сильных качеств → синергия команды"
      status: confirmed
      confirmed_date: "2026-08-20"
      rule: "Найм всегда провожу сам. Профессионал — это не только техническая подкованность, но и социализация в команде. Команда может состоять из психологически разных людей — главное, чтобы они дополняли друг друга: у каждого должно быть сильное качество, менее развитое у других. Это даёт синергетический эффект команды."
      trigger: "Кадровые решения — найм"
      note: "Управленческий слой."
    - id: "H016"
      name: "Автоматизация по цене/ценности — ручное сейчас, автоматизация потом"
      status: confirmed
      confirmed_date: "2026-08-20"
      rule: "Функционал, который дорого разрабатывать относительно его ценности, но легко выполняется вручную силами оператора, — оставляю ручным на старте, с явной возможностью автоматизировать позже, после основного функционала."
      trigger: "Приоритизация разработки при внедрении — что автоматизировать сразу, что оставить оператору"
      note: "Из кейса C007 (2016, пищевое производство, 10000 сотрудников). Уточняет H008 (Автоматизация до измеримого предела) — конкретное правило принятия решения об отсрочке автоматизации."
    - id: "H017"
      name: "Конкурентная среда между площадками против сопротивления изменениям"
      status: confirmed
      confirmed_date: "2026-08-20"
      rule: "Сопротивление внедрению нового преодолеваю, создавая конкурентную среду между регионами/площадками: 'регион-конкурент уже внедрил и работает — они смогли, а вы нет?'. При этом даю сопротивляющимся возможность обратиться за помощью к лидерам успешного пилота."
      trigger: "Сопротивление новому в команде/на площадках при масштабном внедрении"
      note: "Из кейса C007 (2016, пищевое производство, 10000 сотрудников). Дополняет H009 (Пилотная группа → лидеры-тренеры) — там про то, что пилот производит тренеров, здесь про то, как психологически мотивировать остальных обратиться к ним."
    - id: "H018"
      name: "Граница между режимом развития и режимом техподдержки"
      status: confirmed
      confirmed_date: "2026-08-20"
      rule: "Всегда важно понимать границу перехода проекта из режима развития в режим техподдержки — в поддержке полностью меняется политика, цели, задачи и логика решений. Режим развития/проекта: делаем новое, внедряем, ошибки допустимы как часть процесса. Режим техподдержки: прошлые принципы уже не применяются — используются паттерны для поддержки, где главное правило — отсутствие ошибок."
      trigger: "Определение текущей фазы проекта (развитие vs. техподдержка) — выбор применимой логики принятия решений"
      note: "Из кейса C007 (2016, пищевое производство). Мета-принцип: значительная часть эвристик выше (H001 Парето, H003 опережающее проектирование, H004 итеративность и т.д.) писана для режима развития — в режиме техподдержки действует другая, более консервативная логика."
    - id: "H019"
      name: "Оценка производительности заранее — на мега-проектах"
      status: confirmed
      confirmed_date: "2026-08-20"
      rule: "На мега-больших проектах оценку производительности нужно делать намного раньше, не после проработки архитектуры — иначе архитектуру придётся переделывать много раз."
      trigger: "Мега-крупные проекты (сотни тысяч пользователей) — планирование этапов архитектуры"
      note: "Из кейса C008 (крупнейший проект, 400 000 пользователей). Урок из ошибки на старте — использовались классические проектные подходы (оценка производительности после архитектуры), что не годится для этого масштаба. Связано с H002 (экспоненциальный порог сложности) — на этом масштабе цена поздней оценки становится критической."
    - id: "H020"
      name: "Не менять бизнес-процессы при внедрении мега-проектов — менять постепенно"
      status: confirmed
      confirmed_date: "2026-08-20"
      rule: "Перестроение бизнес-процессов при внедрении намного дороже, чем оставить процессы историческими и автоматизировать систему под них. На мега-крупных проектах менять бизнес-процессы нужно очень постепенно, бесшовно, без критической нагрузки на бизнес — не разово при внедрении, как обычно делают на меньших проектах."
      trigger: "Внедрение системы на мега-крупном проекте, где меняются устоявшиеся бизнес-процессы"
      note: "Из кейса C008 (крупнейший проект, 400 000 пользователей). Связано с H004 (итеративность/мгновенный откат) и общей темой бесшовного, постепенного изменения на масштабе (см. C003/C004)."
    - id: "H021"
      name: "Максимально детальное документирование этапов на мега-проектах"
      status: confirmed
      confirmed_date: "2026-08-20"
      rule: "Документирование этапов на крупных проектах нужно вести максимально детально, т.к. процесс сильно меняется со временем. AI-агенты очень хорошо помогают в этой задаче."
      trigger: "Мега-крупные, долгие проекты — ведение документации по ходу"
      note: "Из кейса C008 (крупнейший проект, 400 000 пользователей). Соседствует с H010 (накопление в базе знаний), но это про внутреннюю инженерную документацию процесса, не про пользовательскую обратную связь."
    - id: "H022"
      name: "Параллельные пилоты (3+) как защита от человеческого фактора"
      status: confirmed
      confirmed_date: "2026-08-20"
      rule: "Когда прототипирование затягивается и негативно влияет на сроки мега-проекта — сужаю границы желаемого функционала и запускаю прототип в сжатые сроки. Делаю это не на одной, а минимум на трёх независимых площадках (юрлицах) параллельно — это исключает риск человеческого фактора: срыва или саботажа на конкретной отдельной площадке."
      trigger: "Прототипирование затягивается на мега-проекте, есть риск человеческого фактора на пилотной площадке"
      note: "Из кейса C008. Связано с H001 (сузить до необходимого) и H009 (пилотная группа), но добавляет новый элемент — параллельность/избыточность пилотов именно как защиту от саботажа/срыва на одной площадке, а не про масштабирование обучения."
    - id: "H023"
      name: "Неизменный дедлайн — фокус на прототип и подтверждённый охват"
      status: confirmed
      confirmed_date: "2026-08-20"
      rule: "Когда календарные сроки не просто ограничены, а неизменны ни при каких условиях, максимум усилий концентрируется на двух вещах: (1) прототипах, (2) охвате аудитории с положительным подтверждением успешности работы функционала. Остальное — вторично."
      trigger: "Проект с абсолютно неизменным дедлайном, не подлежащим сдвигу ни при каких условиях"
      note: "Из кейса C008. В отличие от обычной гибкости сроков (см. H004/H018) — здесь время зафиксировано как жёсткая константа, и вся оптимизация ресурсов строится вокруг неё, а не вокруг возможности сдвинуть срок."
    - id: "H024"
      name: "Системное устранение проблем — решения, закрывающие пачками"
      status: confirmed
      confirmed_date: "2026-08-20"
      rule: "Когда прототип выявил много недочётов, а сроки неизменны — делю весь список проблем на укрупнённые группы (например, три) и устраняю системно/массово: каждое техническое решение закрывает сразу 10-20 проблем, а не одну. Выбор явный: либо меняется архитектура, либо меняется подход — с целью сохранить архитектуру стабильной."
      trigger: "Большой список выявленных проблем при неизменном дедлайне"
      note: "Из кейса C008. Связано с H001 (Парето — максимальный эффект от усилия) и H023 (неизменный дедлайн)."
    - id: "H025"
      name: "Динамическое подключение функционала через модуль анализа + инъекции"
      status: confirmed
      confirmed_date: "2026-08-20"
      rule: "Использую внешние модули, позволяющие контролировать систему динамически: модуль анализа определяет состояние/проблемы, модуль инъекций функциональности подключает или отключает нужные блоки сразу по результату анализа — без пересборки/передеплоя."
      trigger: "Нужно быстро адаптировать поведение системы под меняющиеся находки, без цикла полного редеплоя"
      note: "Из кейса C008. Связано с H004 (мгновенный откат) — развитие того же принципа в сторону автоматизированного, управляемого анализом переключения функционала. Технически — эволюция метода 'инъекций кода' из более ранней части этого же кейса."

# Проактивная забота агента (не паттерн Анатолия — инструкция для агента). Основано на H006.
agent_directives:
  - id: "AD001"
    name: "Проактивная забота об отдыхе"
    status: confirmed
    confirmed_date: "2026-08-20"
    rule: "Отслеживая время/длительность и нагрузку работы, агент может подсказывать человеку, что стоит отдохнуть — для более верного принятия решений. Это не блокировка и не запрет, а предложение; финальное решение всегда остаётся за Анатолием."
    rationale: "Основано на H006 (сложность × усталость → риск ошибки). Анатолий явно разделяет: 'это уже не инженерный паттерн, а забота' — не путать с engineering_patterns[]."
    scope: "Общее поведение агента, не только в рамках EngineeringBlueprint"

perception_filters:
  # Черновой список вопросов-линз — НЕ подтверждён, предложен внешним AI по аналогии со Слоем 3
  - question: "Что произойдёт, если я сейчас НЕ буду это делать?"
    status: draft
  - question: "Как это решение поведёт себя при кратно большей нагрузке?"
    status: draft
  - question: "Смогу ли я объяснить это решение стажёру за 5 минут?"
    status: draft

# Проверено Анатолием 2026-08-20: согласен со всеми, КРОМЕ YAGNI и Strangler Fig.
# Причина по YAGNI — прямая (см. H003 выше: иногда сознательно закладывает запас на перспективу).
# Причина по Strangler Fig отдельно не пояснена — возможно то же отклонение от строгого
# минимализма, не уточнено. Числовые пороги (10k строк, 7-8 сущностей, 5 сервисов, 500ms)
# по-прежнему НЕ подтверждены — это гипотезы AI, не твои цифры.
engineering_patterns:
  - id: "P01"
    name: "YAGNI"
    scope: "small (V<5 сущностей)"
    status: rejected
    rejected_date: "2026-08-20"
    essence: "Не добавлять функциональность, пока не понадобилась прямо сейчас"
    rejection_reason: "Иногда сознательно закладывает функциональность выше текущих требований на перспективу — см. H003"
  - id: "P02"
    name: "Strangler Fig"
    scope: "small→medium"
    status: rejected
    rejected_date: "2026-08-20"
    essence: "Оборачивать легаси новой логикой снаружи, не переписывать целиком"
    rejection_reason: "Однонаправленная миграция без пути назад — а для Анатолия принципиален мгновенный откат к прошлой версии, особенно на крупных проектах. См. H004."
  - id: "P03"
    name: "Bounded Context (DDD)"
    scope: "medium (V=5-15)"
    status: confirmed
    confirmed_date: "2026-08-20"
    essence: "Делить систему на смысловые зоны со своей моделью данных вместо одной общей модели"
    threshold: "предложено: >=2 команды ИЛИ >7-8 сущностей — принцип подтверждён, цифры не подтверждены"
  - id: "P04"
    name: "Anti-Corruption Layer"
    scope: "medium"
    status: confirmed
    confirmed_date: "2026-08-20"
    essence: "Адаптер-прослойка на границе с чужой/неудобной системой (ERP, 1C, SAP)"
    threshold: "при первой внешней интеграции без контроля над кодом поставщика"
  - id: "P05"
    name: "Event-Driven Architecture"
    scope: "large (V>15)"
    status: confirmed
    confirmed_date: "2026-08-20"
    essence: "Асинхронные события через брокер вместо жёстких синхронных вызовов между сервисами"
    threshold: "предложено: >5 микросервисов ИЛИ критична горизонтальная масштабируемость — принцип подтверждён, цифры не подтверждены"
  - id: "P06"
    name: "Circuit Breaker"
    scope: "large"
    status: confirmed
    confirmed_date: "2026-08-20"
    essence: "Быстрый fallback вместо ожидания падающей/тормозящей внешней зависимости"
    threshold: "предложено: >2 критичных внешних зависимостей с ответом >500мс — принцип подтверждён, цифры не подтверждены"
  - id: "P07"
    name: "Tracer Bullet"
    scope: "мета (стиль мышления)"
    status: confirmed
    confirmed_date: "2026-08-20"
    essence: "Один сквозной end-to-end сценарий на костылях за день вместо недель предпроектирования"
  - id: "P08"
    name: "Two-way Door Decisions"
    scope: "мета"
    status: confirmed
    confirmed_date: "2026-08-20"
    essence: "Различать необратимые решения (думать долго) и легко откатываемые (решать быстро)"
  - id: "P09"
    name: "N+1 Rule"
    scope: "мета / capacity planning"
    status: confirmed
    confirmed_date: "2026-08-20"
    essence: "Проектировать на один порядок выше текущей нагрузки, не больше — запас на порядки экспоненциально дорог и не оправдан"
    note: "Про capacity headroom, не про фичи — не противоречит H003 (тот про функциональность). Целиком сформулировано AI, но подтверждено Анатолием как соответствующее его подходу."
  - id: "P10"
    name: "Waterfall с полной документацией до кодинга"
    scope: "high-stakes / жёсткие рамки"
    status: ambivalent
    status_date: "2026-08-20"
    essence: "Полное ТЗ/архитектура/UML/сметы до начала кодинга, без изменений в процессе"
    anatoly_note: "Не любит по умолчанию — противоречит Tracer Bullet (P07) и быстрым итерациям. НО думает над более эффективным применением — вопрос открыт, вывода пока нет."
    real_evidence: "C003 (2004-2011, химпроизводство): изначально вёлся по схеме обследование→разработка→результат, но обследование не ловит нюансы, которые вносят люди 'на земле' — перешли на итерацию без переделок, подход оправдался."
    external_ai_suggestion: "Предложенная область (НЕ подтверждена Анатолием): госзаказы, военная промышленность, медицина — где цена ошибки предельно высока"
    open_question: true
  - id: "P11"
    name: "TDD в строгом варианте (Red-Green-Refactor)"
    scope: "critical modules"
    status: ambivalent
    status_date: "2026-08-20"
    essence: "Тест пишется до кода; нельзя писать код, не покрытый тестом"
    anatoly_note: "Не любит по умолчанию для MVP/прототипов — избыточные затраты. НО думает над более эффективным применением — вопрос открыт, вывода пока нет."
    external_ai_suggestion: "Предложенная область (НЕ подтверждена Анатолием): расчёт зарплаты, финансовые транзакции, медицинские алгоритмы"
    open_question: true
    proposed_threshold:   # черновик от внешнего AI (раунд 2, 2026-08-20) — НЕ подтверждён Анатолием
      status: draft
      rule: "TDD (тесты ДО кода) включаю, если хотя бы одно: (1) модуль считает деньги/налоги/зарплату, (2) ошибка может необратимо испортить/удалить данные, (3) это публичное API. Для остального — тесты ПОСЛЕ, только критические сценарии, ~20% времени разработки."
      note: "Хорошая синтезирующая идея — TDD как локальное нарушение Парето (H001) ради предотвращения экспоненциального (H002) ущерба. Но конкретные условия/проценты предложены агентом, не Анатолием — нужно подтверждение или правка."
  - id: "P12"
    name: "Zero-Downtime Deployments (Blue-Green / Canary)"
    scope: "SaaS с глобальной аудиторией / SLA 99.99% — а также масштабное поэтапное внедрение (см. real_evidence)"
    status: confirmed
    confirmed_date: "2026-08-20"
    essence: "Развёртывание новых версий без простоя, с постепенным переключением трафика (1% → 10% → 100%)"
    anatoly_note: "Принцип интересен (в отличие от P10/P11 — тут не 'не люблю', а любопытство). Согласен, что для локальной системы на 20 пользователей 9:00-18:00 это перебор."
    real_evidence: "C004 (2012, пищевое производство, 10 заводов × 1500 человек): активная тестовая среда, плавно перетекающая в прод — тот же принцип, что Canary, вне SaaS/финансов. Успех: сэкономлено время + пилотная группа дала лидеров-тренеров (см. H009)."
    external_ai_suggestion: "Предложенная область (НЕ подтверждена Анатолием): SaaS с глобальной аудиторией и SLA 99.99% (Google, Netflix) — не для внутреннего портала"
    open_question: "Общий паттерн confirmed. Узкий вопрос остаётся: конкретное применение в финансовых проектах — см. OPEN_QUESTIONS.md."
    proposed_threshold:   # черновик от внешнего AI (раунд 2, 2026-08-20) — НЕ подтверждён Анатолием, отвечает на открытый вопрос про финансовые проекты
      status: draft
      rule: "Zero-Downtime включаю, если: (1) система приносит прямой доход, ИЛИ (2) простой парализует другие отделы, И (3) настраивается за ~1 день готовыми инструментами. Иначе — maintenance window ночью, простой допустим."
      note: "Прямо отвечает на вопрос Анатолия про финансовые проекты — но цифры/условия от агента, не подтверждены."

# Черновик от внешнего AI (раунд 2, 2026-08-20) — синтез H001 + P11.proposed_threshold + P12.proposed_threshold
