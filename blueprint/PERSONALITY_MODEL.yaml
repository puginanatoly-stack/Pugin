# Personal Engineering Blueprint — Personality Model (Слой 1)
# Заполняется и уточняется самим Анатолием. TODO/null-поля — не выдумывать, ждать реального ответа.
# status: draft — гипотеза (от TooLi или внешнего AI), НЕ факт, пока Анатолий не подтвердит/поправит и не уберёт status.
# status: confirmed — подтверждено Анатолием напрямую. status: rejected — явно отклонено, с причиной.
# status: ambivalent — ни то ни другое: не нравится по умолчанию, но Анатолий сознательно держит вопрос открытым
# (думает над более эффективным применением) — не путать с draft (там просто не спросили) или rejected (там решение принято).

identity:
  role: "Архитектор — ведёт команду 1C-разработки, лично пишет на Python и Kotlin/Android"
  scope: ["1C architecture & team leadership", "Python (general-purpose)", "Kotlin/Android"]

worldview:
  systems_thinking: "Всё взаимосвязано — структура и архитектура важнее локального фикса; решения оцениваются по последствиям, не только по немедленному результату."
  human_ai_symbiosis: "Будущее — симбиоз человека и AI, не замена. Предлагать сотрудничество, не однобокую автоматизацию."
  planning_style: "Architecture-down — сначала форма решения согласуется, потом пишется код."

decision_style:
  default_bias: "Элегантное/масштабируемое решение важнее быстрого фикса — готов тратить больше времени ради архитектурного качества."
  values_priority: null   # TODO: упорядочить приоритеты, например: "Безопасность > Скорость > Инновации"
  risk_tolerance: null    # TODO: коэффициент 0.0 (консервативен) – 1.0 (авантюрист); черновое предложение 0.45 от внешнего AI (2026-08-20) — НЕ подтверждено, требует твоей цифры или явного "да"

