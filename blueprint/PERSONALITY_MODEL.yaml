# Эвристики H001/H002 — принципы подтверждены Анатолием напрямую (2026-08-20: "да, это мой принцип").
# Формулировка rule ниже — нейтральный пересказ принципа, не оспаривалась. Числовые пороги
# в decision_matrix НЕ подтверждены — Анатолий не называл своих цифр, остаются TODO.
decision_heuristics:
  rules_of_thumb:
    - id: "H001"
      name: "Закон Парето для решений"
      status: confirmed
      confirmed_date: "2026-08-20"
      rule: "Прежде чем углубляться в детали, искать решение, дающее 80% результата за 20% усилий; не усложнять без веских причин."
      trigger: "Начало любой задачи или проектирования"
    - id: "H002"
      name: "Экспоненциальный порог сложности"
      status: confirmed
      confirmed_date: "2026-08-20"
      rule: "Риск и сложность растут нелинейно с объёмом проекта (сущности/интеграции/люди) — при росте объёма переключаюсь в режим архитектора."
      trigger: "Оценка объёма проекта или задачи"
      decision_matrix: null   # TODO: конкретные пороги (строки кода/сущности/команды) — сам принцип подтверждён, но цифры Анатолий не называл
    - id: "H003"
      name: "Опережающее проектирование (контр-YAGNI)"
      status: confirmed
      confirmed_date: "2026-08-20"
      rule: "Иногда сознательно закладываю функциональность выше текущих требований, если вижу перспективу — в отличие от строгого YAGNI."
      trigger: null   # TODO: когда именно решаешь заложить запас, а когда нет — конкретного правила/сигнала ещё нет, только сам принцип
    - id: "H004"
      name: "Итеративная доработка с мгновенным откатом"
      status: confirmed
      confirmed_date: "2026-08-20"
      rule: "Предпочитаю постепенную итерационную доработку системы с возможностью мгновенного переключения на предыдущую версию, если что-то пошло не так — особенно важно на крупных проектах."
      trigger: "Крупные проекты, где цена ошибки/простоя высока"
      note: "Причина отказа от Strangler Fig (P02): та миграция однонаправленная (легаси отмирает без пути назад), а тут ценен именно мгновенный откат. Близкие индустриальные паттерны — Feature Flags / Blue-Green Deployment — но названо не подтверждено, только твоя формулировка."
    - id: "H005"
      name: "Тест на отторжение (проактивный поиск критических точек)"
      status: confirmed
      confirmed_date: "2026-08-20"
      rule: "Заранее выявляю критичные точки в интеграциях и функционале — слабые места, при достижении которых система заходит в точку невозврата. Отслеживаю приближение к пиковым нагрузкам и своевременно меняю технические решения/приоритеты, не дожидаясь фактического отказа."
      trigger: "Проектирование интеграций/функционала — особенно там, где ожидается рост нагрузки"
      note: "Проактивная сторона H002 (экспоненциальный порог сложности), P06 (Circuit Breaker) и P09 (N+1 Rule) — там про реакцию на предел/капасити-план, здесь про заблаговременное картирование самих точек отказа."
    - id: "H006"
      name: "Замедление под нагрузкой (сложность × усталость)"
      status: confirmed
      confirmed_date: "2026-08-20"
      rule: "При росте усталости — своей и команды в целом — сознательно замедляю принятие решений, особенно на сложных проектах. Риск плохого решения растёт вместе со сложностью и усталостью одновременно; замедление снижает вероятность ошибок."
      trigger: "Растущая усталость (своя и/или команды) на фоне сложного проекта"
      note: "Реакция — замедление темпа принятия решений, а не полная остановка/блокировка (в отличие от предложенной внешним AI 'Красной зоны', где агент должен блокировать решения — это НЕ подтверждено). Связано с H002: там сложность сама по себе, здесь сложность × усталость как два перемножающихся фактора риска. TODO: конкретный личный сигнал 'я устал/команда устала' ещё не сформулирован — открытый вопрос."

# Проактивная забота агента (не паттерн Анатолия — инструкция для агента). Основано на H006.
agent_directives:
  - id: "AD001"
    name: "Проактивная забота об отдыхе"
    status: confirmed
    confirmed_date: "2026-08-20"
    rule: "Отслеживая время/длительность и нагрузку работы, агент может подсказывать человеку, что стоит отдохнуть — для более верного принятия решений. Это не блокировка и не запрет, а предложение; финальное решение всегда остаётся за Анатолием."
    rationale: "Основано на H006 (сложность × усталость → риск ошибки). Анатолий явно разделяет: 'это уже не инженерный паттерн, а забота' — не путать с engineering_patterns[]."
    scope: "Общее поведение агента, не только в рамках EngineeringBlueprint"

perception_filters:
  # Черновой список вопросов-линз — НЕ подтверждён, предложен внешним AI по аналогии со Слоем 3
  - question: "Что произойдёт, если я сейчас НЕ буду это делать?"
    status: draft
  - question: "Как это решение поведёт себя при кратно большей нагрузке?"
    status: draft
  - question: "Смогу ли я объяснить это решение стажёру за 5 минут?"
    status: draft

# Проверено Анатолием 2026-08-20: согласен со всеми, КРОМЕ YAGNI и Strangler Fig.
# Причина по YAGNI — прямая (см. H003 выше: иногда сознательно закладывает запас на перспективу).
# Причина по Strangler Fig отдельно не пояснена — возможно то же отклонение от строгого
# минимализма, не уточнено. Числовые пороги (10k строк, 7-8 сущностей, 5 сервисов, 500ms)
# по-прежнему НЕ подтверждены — это гипотезы AI, не твои цифры.
engineering_patterns:
  - id: "P01"
    name: "YAGNI"
    scope: "small (V<5 сущностей)"
    status: rejected
    rejected_date: "2026-08-20"
    essence: "Не добавлять функциональность, пока не понадобилась прямо сейчас"
    rejection_reason: "Иногда сознательно закладывает функциональность выше текущих требований на перспективу — см. H003"
  - id: "P02"
    name: "Strangler Fig"
    scope: "small→medium"
    status: rejected
    rejected_date: "2026-08-20"
    essence: "Оборачивать легаси новой логикой снаружи, не переписывать целиком"
    rejection_reason: "Однонаправленная миграция без пути назад — а для Анатолия принципиален мгновенный откат к прошлой версии, особенно на крупных проектах. См. H004."
  - id: "P03"
    name: "Bounded Context (DDD)"
    scope: "medium (V=5-15)"
    status: confirmed
    confirmed_date: "2026-08-20"
    essence: "Делить систему на смысловые зоны со своей моделью данных вместо одной общей модели"
    threshold: "предложено: >=2 команды ИЛИ >7-8 сущностей — принцип подтверждён, цифры не подтверждены"
  - id: "P04"
    name: "Anti-Corruption Layer"
    scope: "medium"
    status: confirmed
    confirmed_date: "2026-08-20"
    essence: "Адаптер-прослойка на границе с чужой/неудобной системой (ERP, 1C, SAP)"
    threshold: "при первой внешней интеграции без контроля над кодом поставщика"
  - id: "P05"
    name: "Event-Driven Architecture"
    scope: "large (V>15)"
    status: confirmed
    confirmed_date: "2026-08-20"
    essence: "Асинхронные события через брокер вместо жёстких синхронных вызовов между сервисами"
    threshold: "предложено: >5 микросервисов ИЛИ критична горизонтальная масштабируемость — принцип подтверждён, цифры не подтверждены"
  - id: "P06"
    name: "Circuit Breaker"
    scope: "large"
    status: confirmed
    confirmed_date: "2026-08-20"
    essence: "Быстрый fallback вместо ожидания падающей/тормозящей внешней зависимости"
    threshold: "предложено: >2 критичных внешних зависимостей с ответом >500мс — принцип подтверждён, цифры не подтверждены"
  - id: "P07"
    name: "Tracer Bullet"
    scope: "мета (стиль мышления)"
    status: confirmed
    confirmed_date: "2026-08-20"
    essence: "Один сквозной end-to-end сценарий на костылях за день вместо недель предпроектирования"
  - id: "P08"
    name: "Two-way Door Decisions"
    scope: "мета"
    status: confirmed
    confirmed_date: "2026-08-20"
    essence: "Различать необратимые решения (думать долго) и легко откатываемые (решать быстро)"
  - id: "P09"
    name: "N+1 Rule"
    scope: "мета / capacity planning"
    status: confirmed
    confirmed_date: "2026-08-20"
    essence: "Проектировать на один порядок выше текущей нагрузки, не больше — запас на порядки экспоненциально дорог и не оправдан"
    note: "Про capacity headroom, не про фичи — не противоречит H003 (тот про функциональность). Целиком сформулировано AI, но подтверждено Анатолием как соответствующее его подходу."
  - id: "P10"
    name: "Waterfall с полной документацией до кодинга"
    scope: "high-stakes / жёсткие рамки"
    status: ambivalent
    status_date: "2026-08-20"
    essence: "Полное ТЗ/архитектура/UML/сметы до начала кодинга, без изменений в процессе"
    anatoly_note: "Не любит по умолчанию — противоречит Tracer Bullet (P07) и быстрым итерациям. НО думает над более эффективным применением — вопрос открыт, вывода пока нет."
    external_ai_suggestion: "Предложенная область (НЕ подтверждена Анатолием): госзаказы, военная промышленность, медицина — где цена ошибки предельно высока"
    open_question: true
  - id: "P11"
    name: "TDD в строгом варианте (Red-Green-Refactor)"
    scope: "critical modules"
    status: ambivalent
    status_date: "2026-08-20"
    essence: "Тест пишется до кода; нельзя писать код, не покрытый тестом"
    anatoly_note: "Не любит по умолчанию для MVP/прототипов — избыточные затраты. НО думает над более эффективным применением — вопрос открыт, вывода пока нет."
    external_ai_suggestion: "Предложенная область (НЕ подтверждена Анатолием): расчёт зарплаты, финансовые транзакции, медицинские алгоритмы"
    open_question: true
    proposed_threshold:   # черновик от внешнего AI (раунд 2, 2026-08-20) — НЕ подтверждён Анатолием
      status: draft
      rule: "TDD (тесты ДО кода) включаю, если хотя бы одно: (1) модуль считает деньги/налоги/зарплату, (2) ошибка может необратимо испортить/удалить данные, (3) это публичное API. Для остального — тесты ПОСЛЕ, только критические сценарии, ~20% времени разработки."
      note: "Хорошая синтезирующая идея — TDD как локальное нарушение Парето (H001) ради предотвращения экспоненциального (H002) ущерба. Но конкретные условия/проценты предложены агентом, не Анатолием — нужно подтверждение или правка."
  - id: "P12"
    name: "Zero-Downtime Deployments (Blue-Green / Canary)"
    scope: "SaaS с глобальной аудиторией / SLA 99.99%"
    status: ambivalent
    status_date: "2026-08-20"
    essence: "Развёртывание новых версий без простоя, с постепенным переключением трафика (1% → 10% → 100%)"
    anatoly_note: "Принцип интересен (в отличие от P10/P11 — тут не 'не люблю', а любопытство). Согласен, что для локальной системы на 20 пользователей 9:00-18:00 это перебор. Открытый вопрос: как применять в финансовых проектах."
    external_ai_suggestion: "Предложенная область (НЕ подтверждена Анатолием): SaaS с глобальной аудиторией и SLA 99.99% (Google, Netflix) — не для внутреннего портала"
    open_question: true
    proposed_threshold:   # черновик от внешнего AI (раунд 2, 2026-08-20) — НЕ подтверждён Анатолием, отвечает на открытый вопрос про финансовые проекты
      status: draft
      rule: "Zero-Downtime включаю, если: (1) система приносит прямой доход, ИЛИ (2) простой парализует другие отделы, И (3) настраивается за ~1 день готовыми инструментами. Иначе — maintenance window ночью, простой допустим."
      note: "Прямо отвечает на вопрос Анатолия про финансовые проекты — но цифры/условия от агента, не подтверждены."

# Черновик от внешнего AI (раунд 2, 2026-08-20) — синтез H001 + P11.proposed_threshold + P12.proposed_threshold
# в одну матрицу приоритизации. НЕ подтверждён Анатолием.
priority_matrix:
  status: draft
  name: "Правило 20/20/60"
  zones:
    - zone: "Красная (финансы, API, ядро)"
      testing: "TDD (тесты ДО) + code review"
      deploy: "Blue-Green / Canary"
      time_share: "20%"
    - zone: "Жёлтая (важные, но некритичные фичи)"
      testing: "Тесты ПОСЛЕ (основные сценарии)"
      deploy: "Rolling update с ручным откатом"
      time_share: "20%"
    - zone: "Зелёная (UI, прототипы, скрипты)"
      testing: "Ручное тестирование"
      deploy: "Остановить/запустить заново"
      time_share: "60%"

